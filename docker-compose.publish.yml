# Bind-mount-free compose for GHCR Compose OCI publish.
# Operators: docker compose -f oci://ghcr.io/tagbase/tagbase-stack:vX.Y.Z up -d
# Required: POSTGRES_PASSWORD, NGINX_PASS, PGADMIN_DEFAULT_PASSWORD
# Optional Let's Encrypt: --profile letsencrypt plus TLS_DOMAIN and ACME_EMAIL
x-syslog: &syslog
  driver: syslog
  options:
    syslog-address: "udp://${SYSLOG_ADDRESS:-host.docker.internal:514}"
    tag: "tagbase-{{.Name}}"

services:
  dbbackups:
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - DUMPPREFIX=PG_db
      - POSTGRES_USER=tagbase
      - POSTGRES_PASS=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_HOST=postgis
      - REMOVE_BEFORE=30
    hostname: pg-backups
    image: kartoza/pg-backup:18-3.6@sha256:42672c4aa6c6683216aac44107247ba900d999e5b528af3f022879242218442b
    platform: linux/amd64
    logging: *syslog
    networks:
      - internal-network
    volumes:
      - dbbackups:/backups
    restart: on-failure

  docker-cron:
    image: ghcr.io/tagbase/tagbase-docker-cron:${TAGBASE_VERSION:-latest}
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    logging: *syslog
    networks:
      - internal-network
    restart: unless-stopped

  fswatch:
    image: ghcr.io/tagbase/tagbase-fswatch:${TAGBASE_VERSION:-latest}
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    logging: *syslog
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - staging-data:/usr/src/app/staging_data:ro

  nginx:
    image: ghcr.io/tagbase/tagbase-nginx:${TAGBASE_VERSION:-latest}
    environment:
      - NGINX_USER=${NGINX_USER:-tagbase}
      - NGINX_PASS=${NGINX_PASS:?set NGINX_PASS}
    depends_on:
      - pgadmin4
      - tagbase_server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ | grep -q 301",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *syslog
    networks:
      - internal-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
      - acme-www:/var/www/acme
    restart: unless-stopped

  lego:
    profiles: ["letsencrypt"]
    image: ghcr.io/tagbase/tagbase-lego:${TAGBASE_VERSION:-latest}
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_DIRECTORY=${ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - lego-data:/lego
      - nginx-certs:/etc/nginx/certs
      - acme-www:/var/www/acme

  pgadmin4:
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_LISTEN_PORT=5434
    expose:
      - 5434
    hostname: pgadmin4
    image: dpage/pgadmin4:9.17@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    logging: *syslog
    networks:
      - internal-network
    restart: unless-stopped

  postgis:
    environment:
      - ALLOW_IP_RANGE=0.0.0.0/0
      - PASSWORD_AUTHENTICATION=md5
      - POSTGRES_DB=tagbase
      - POSTGRES_PASS=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_USER=tagbase
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology,postgis_raster,pgrouting
      - SCRIPTS_LOCKFILE_DIR=/opt/data/
    expose:
      - ${POSTGRES_PORT:-5432}
    healthcheck:
      test: >-
        PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
        psql -d tagbase -h localhost -U tagbase -tAc
        "SELECT to_regclass('public.submission')"
        | grep -q submission
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    hostname: postgis
    image: ghcr.io/tagbase/tagbase-postgis:${TAGBASE_VERSION:-latest}
    platform: linux/amd64
    logging: *syslog
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - dbbackups:/backups
      - postgis-data:/var/lib/postgresql
      - type: tmpfs
        target: /opt/data

  tagbase_server:
    image: ghcr.io/tagbase/tagbase-server:${TAGBASE_VERSION:-latest}
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-tagbase_server}
    expose:
      - 5433
    hostname: tagbase_server
    logging: *syslog
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - tagbase-logs:/usr/src/app/logs

  alloy:
    image: ghcr.io/tagbase/tagbase-alloy:${TAGBASE_VERSION:-latest}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - PROM_ENDPOINT=${PROM_ENDPOINT:-}
      - PROM_USERNAME=${PROM_USERNAME:-}
      - PROM_PASSWORD=${PROM_PASSWORD:-}
      - LOKI_ENDPOINT=${LOKI_ENDPOINT:-}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}
      - TEMPO_ENDPOINT=${TEMPO_ENDPOINT:-}
      - TEMPO_USERNAME=${TEMPO_USERNAME:-}
      - TEMPO_PASSWORD=${TEMPO_PASSWORD:-}
    volumes:
      - alloy-data:/var/lib/alloy/data
    ports:
      - "514:1514/udp"
    expose:
      - "12345"
      - "4317"
      - "4318"
      - "1514/udp"
    networks:
      - internal-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: ghcr.io/tagbase/tagbase-prometheus:${TAGBASE_VERSION:-latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    logging: *syslog
    volumes:
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - internal-network
    restart: unless-stopped

  loki:
    image: ghcr.io/tagbase/tagbase-loki:${TAGBASE_VERSION:-latest}
    command: ["-config.file=/etc/loki/loki-config.yml"]
    logging: *syslog
    volumes:
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - internal-network
    restart: unless-stopped

  tempo:
    image: ghcr.io/tagbase/tagbase-tempo:${TAGBASE_VERSION:-latest}
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    logging: *syslog
    volumes:
      - tempo-data:/var/tempo
    expose:
      - "3200"
    networks:
      - internal-network
    restart: unless-stopped

  grafana:
    image: ghcr.io/tagbase/tagbase-grafana:${TAGBASE_VERSION:-latest}
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/tagbase-ingest.json
    logging: *syslog
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - internal-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  internal-network:

volumes:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  nginx-certs:
  acme-www:
  lego-data:
  postgis-data:
  staging-data:
  dbbackups:
  tagbase-logs:
