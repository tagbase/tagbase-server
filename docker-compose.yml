services:
  dbbackups:
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - DUMPPREFIX=PG_db
      - POSTGRES_USER=tagbase
      - POSTGRES_PASS=${POSTGRES_PASSWORD:-tagbase}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_HOST=postgis
      - REMOVE_BEFORE=30
    hostname: pg-backups
    image: kartoza/pg-backup:18-3.6@sha256:42672c4aa6c6683216aac44107247ba900d999e5b528af3f022879242218442b
    platform: linux/amd64
    labels:
      "docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "Docker PostGIS backup"
      "docker_compose_diagram.icon": "docker"
    links:
      - postgis
    networks:
      - internal-network
    volumes:
      - ./dbbackups:/backups
    restart: on-failure
  docker-cron:
    build:
      context: ./services/docker-cron
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tagbase}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    labels:
      "docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "'metadata_types' and\n'observation_types' synchronization"
      "docker_compose_diagram.icon": "python"
    links:
      - postgis
    networks:
      - internal-network
    restart: unless-stopped
  fswatch:
    build:
      context: ./services/fswatch
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tagbase}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    labels:
      "docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "Automatic file ingestion"
      "docker_compose_diagram.icon": "go"
    links:
      - tagbase_server
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - ./staging_data:/usr/src/app/staging_data:ro
      - fswatch-state:/var/lib/tagbase-fswatch
  nginx:
    build:
      context: ./services/nginx
    environment:
      - NGINX_USER=${NGINX_USER:-tagbase}
      - NGINX_PASS=${NGINX_PASS:-tagbase}
    labels:
      #"docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "Reverse proxy \n and authentication."
      "docker_compose_diagram.icon": "nginx"
    depends_on:
      - pgadmin4
      - tagbase_server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ | grep -q 301",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - internal-network
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./services/nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/proxy/:/usr/share/nginx/html/:ro
      - nginx-certs:/etc/nginx/certs
      - acme-www:/var/www/acme
    restart: unless-stopped
  lego:
    profiles: ["letsencrypt"]
    build:
      context: ./services/lego
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_DIRECTORY=${ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
    labels:
      "docker_compose_diagram.description": "Let's Encrypt HTTP-01 (opt-in)"
      "docker_compose_diagram.icon": "lock"
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - lego-data:/lego
      - nginx-certs:/etc/nginx/certs
      - acme-www:/var/www/acme
  pgadmin4:
    configs:
      - source: pgadmin-pgpass
        target: /run/secrets/pgpass
        uid: "5050"
        gid: "0"
        mode: 0400
    depends_on:
      postgis:
        condition: service_healthy
    # The image copies PGPASS_FILE only while pgadmin4.db is first created.
    # Its /var/lib/pgadmin volume survives recreate, so refresh .pgpass here.
    # Desktop mode resolves PassFile at /var/lib/pgadmin/.pgpass.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -n "$${PGPASS_FILE:-}" ] && [ -f "$$PGPASS_FILE" ]; then
          cp "$$PGPASS_FILE" /var/lib/pgadmin/.pgpass
          chown 5050:0 /var/lib/pgadmin/.pgpass
          chmod 600 /var/lib/pgadmin/.pgpass
        fi
        exec /entrypoint.sh
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-tagbase}
      - PGADMIN_LISTEN_PORT=5434
      # The image compares this value to the string True.
      - PGADMIN_REPLACE_SERVERS_ON_STARTUP=True
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
      # Desktop mode: skip the pgAdmin login form behind nginx basic auth.
      # Use PGADMIN_CONFIG_SERVER_MODE (not PGADMIN_SERVER_MODE) so DATA_DIR
      # stays /var/lib/pgadmin. Quotes make DESKTOP_USER a Python string.
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_USE_OS_SECRET_STORAGE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_CONFIG_DESKTOP_USER='${PGADMIN_DEFAULT_EMAIL:-admin@example.com}'
      # Desktop mode copies this to /var/lib/pgadmin/.pgpass.
      - PGPASS_FILE=/run/secrets/pgpass
    expose:
      - 5434
    hostname: pgadmin4
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    labels:
      "docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "PostgreSQL administration"
      "docker_compose_diagram.icon": "docker"
    links:
      - postgis
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - ./services/pgadmin/servers.json:/pgadmin4/servers.json:ro
  # postgres:
  #   build:
  #     context: ./services/postgres
  #   environment:
  #     - PGDATA=/var/lib/postgresql/data/pgdata
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #   expose:
  #     - ${POSTGRES_PORT}
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -d tagbase -h postgres -U tagbase"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s
  #   hostname: postgres
  #   labels:
  #     "docker_compose_diagram.cluster": "Internal Network"
  #     "docker_compose_diagram.description": "Tagbase PostgreSQL server"
  #   networks:
  #     - internal-network
  #   ports:
  #     - ${POSTGRES_PORT}:${POSTGRES_PORT}
  #   restart: unless-stopped
  #   volumes:
  #     - ./postgres-data:/var/lib/postgresql/data
  postgis:
    environment:
      - ALLOW_IP_RANGE=0.0.0.0/0
      - PASSWORD_AUTHENTICATION=md5
      - POSTGRES_DB=tagbase
      - POSTGRES_PASS=${POSTGRES_PASSWORD:-tagbase}
      - POSTGRES_USER=tagbase
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology,postgis_raster,pgrouting
      - SCRIPTS_LOCKFILE_DIR=/opt/data/
      - SHARED_BUFFERS=${POSTGRES_SHARED_BUFFERS:-1GB}
      - WORK_MEM=${POSTGRES_WORK_MEM:-64MB}
      - MAINTENANCE_WORK_MEM=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      - EXTRA_CONF=max_wal_size = ${POSTGRES_MAX_WAL_SIZE:-8GB}\ncheckpoint_timeout = ${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
    shm_size: 1gb
    expose:
      - ${POSTGRES_PORT:-5432}
    healthcheck:
      # Require tagbase schema (not just pg_isready) so dependents wait for 01-tagbase.sql.
      test: >-
        PGPASSWORD=${POSTGRES_PASSWORD:-tagbase}
        psql -d tagbase -h localhost -U tagbase -tAc
        "SELECT to_regclass('public.submission')"
        | grep -q submission
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    hostname: postgis
    image: kartoza/postgis:18-3.6@sha256:5fa6f8e228a7496d544df3ab580cad9df1686b1f47d02c97f02056ecdc744739
    platform: linux/amd64
    labels:
      "docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "Tagbase PostGIS server"
    networks:
      - internal-network
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./dbbackups:/backups
      - ./postgis-data:/var/lib/postgresql
      # Tables-only SQL: kartoza already creates role/DB; full tagbase_schema.sql
      # aborts on CREATE ROLE/DATABASE and never creates submission/etc.
      - ./services/postgis/tagbase_schema_tables.sql:/docker-entrypoint-initdb.d/01-tagbase.sql
      # Ephemeral lock dir: a named volume survives `compose down` and can skip
      # init scripts after postgis-data is wiped (stale .entry_point.lock).
      - type: tmpfs
        target: /opt/data

  db-migrate:
    image: kartoza/postgis:18-3.6@sha256:5fa6f8e228a7496d544df3ab580cad9df1686b1f47d02c97f02056ecdc744739
    platform: linux/amd64
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - POSTGRES_DB=tagbase
      - POSTGRES_USER=tagbase
      - PGPASSWORD=${POSTGRES_PASSWORD:-tagbase}
    entrypoint: ["psql"]
    command:
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgis
      - -U
      - tagbase
      - -d
      - tagbase
      - -c
      - >-
        BEGIN;
        LOCK TABLE public.submission IN SHARE ROW EXCLUSIVE MODE;
        SELECT setval(
          pg_get_serial_sequence('public.submission', 'submission_id'),
          COALESCE(MAX(submission_id), 1),
          COUNT(*) > 0
        )
        FROM public.submission;
        COMMIT;

    networks:
      - internal-network
    restart: "no"

  tagbase_server:
    build:
      context: ./tagbase_server
    depends_on:
      postgis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tagbase}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-tagbase_server}
    expose:
      - 5433
    hostname: tagbase_server
    labels:
      "docker_compose_diagram.cluster": "Internal Network"
      "docker_compose_diagram.description": "tagbase-server tag \ningestion and administration"
      "docker_compose_diagram.icon": "flask"
    links:
      - postgis
    networks:
      - internal-network
    restart: unless-stopped
    volumes:
      - ./logs:/usr/src/app/logs

  # Alloy + LGTM (always on). Optional Let's Encrypt: --profile letsencrypt
  alloy:
    image: grafana/alloy:v1.21.1@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - PROM_ENDPOINT=${PROM_ENDPOINT:-}
      - PROM_USERNAME=${PROM_USERNAME:-}
      - PROM_PASSWORD=${PROM_PASSWORD:-}
      - LOKI_ENDPOINT=${LOKI_ENDPOINT:-}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}
      - TEMPO_ENDPOINT=${TEMPO_ENDPOINT:-}
      - TEMPO_USERNAME=${TEMPO_USERNAME:-}
      - TEMPO_PASSWORD=${TEMPO_PASSWORD:-}
    volumes:
      - ./services/observability/${ALLOY_CONFIG_FILE:-config.local.alloy}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    # UI + OTLP only on the Docker network; browsers use https://localhost/alloy/
    expose:
      - "12345"
      - "4317"
      - "4318"
      - "1514/udp"
    networks:
      - internal-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./services/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - internal-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./services/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - internal-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./services/observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
    networks:
      - internal-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/tagbase-ingest.json
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - internal-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  internal-network:

volumes:
  fswatch-state:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  nginx-certs:
  acme-www:
  lego-data:

configs:
  pgadmin-pgpass:
    content: |
      postgis:5432:*:tagbase:${POSTGRES_PASSWORD:-tagbase}
