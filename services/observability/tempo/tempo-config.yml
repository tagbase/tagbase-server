# Tempo 3 monolithic (-target=all). No Kafka.
# Migration: https://grafana.com/docs/tempo/latest/set-up-for-tracing/setup-tempo/migrate-to-3/
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Replaces removed `ingester` (max_block_duration carried over).
live_store:
  max_block_duration: 5m

# Replaces removed `compactor` (48h retention carried over).
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

query_frontend: {}
querier: {}
