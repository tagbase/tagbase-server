<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload data | Tagbase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/dropzone@6.3.5/dist/dropzone.css"
      rel="stylesheet"
      integrity="sha384-asD8pW//1IYJd67ZZn/Eyo31U/YtixrhsNyn90jnZTEIgTpYfE2mkwGYVWHwg2vD"
      crossorigin="anonymous"
    />
    <link href="upload.css" rel="stylesheet" />
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-5 upload-container">
      <p><a href="./">← Home</a></p>
      <h1 class="mb-2">Upload data</h1>
      <p>
        Select eTUFF <code>.txt</code>, <code>.zip</code>, <code>.tar.gz</code>,
        or <code>.tgz</code> files. Large files are queued and this page follows
        them until the server finishes.
      </p>
      <form id="upload-form" class="vstack gap-3">
        <div id="ingest-details" class="vstack gap-3">
          <div>
            <label for="version" class="form-label"
              >Version
              <span class="text-body-secondary">(optional)</span></label
            ><input id="version" class="form-control" type="text" />
          </div>
          <div>
            <label for="notes" class="form-label"
              >Notes <span class="text-body-secondary">(optional)</span></label
            ><textarea id="notes" class="form-control" rows="4"></textarea>
          </div>
        </div>
        <div id="drop-zone" class="dropzone">
          <div class="dz-default dz-message">
            <button class="dz-button" type="button">
              Drop files here to upload
            </button>
          </div>
        </div>
        <button
          id="abort"
          class="btn btn-outline-secondary align-self-start d-none"
          type="button"
        >
          Abort upload
        </button>
      </form>
      <div
        id="status"
        class="alert d-none mt-4"
        role="status"
        aria-live="polite"
      ></div>
      <div id="jobs" class="vstack gap-3"></div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/dropzone@6.3.5/dist/dropzone-min.js"
      integrity="sha384-wHTterC8uaPhGVKg8kmSlqcmI8CCFkOI+Mn51O3udobTBX0vQLs6a18vJqh0AnW3"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="upload.js" defer></script>
  </body>
</html>
