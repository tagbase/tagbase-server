# Test stack: PostGIS for integration tests; optional nginx/fswatch for stack markers;
# optional Alloy + LGTM for observability smoke (profile: observability).
services:
  postgis:
    image: kartoza/postgis:18-3.6@sha256:935d2dbeeece33459ab83715fb17dee92499dc4ce47ffee22dedacb3bc861db3
    platform: linux/amd64
    environment:
      - ALLOW_IP_RANGE=0.0.0.0/0
      - PASSWORD_AUTHENTICATION=md5
      - POSTGRES_DB=tagbase
      - POSTGRES_PASS=tagbase
      - POSTGRES_USER=tagbase
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology,postgis_raster,pgrouting
      - SCRIPTS_LOCKFILE_DIR=/opt/data/
      - SHARED_BUFFERS=${POSTGRES_SHARED_BUFFERS:-1GB}
      - WORK_MEM=${POSTGRES_WORK_MEM:-64MB}
      - MAINTENANCE_WORK_MEM=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      - EXTRA_CONF=max_wal_size = ${POSTGRES_MAX_WAL_SIZE:-8GB}\ncheckpoint_timeout = ${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
    shm_size: 1gb
    healthcheck:
      # Require tagbase schema (not just pg_isready) so dependents wait for 01-tagbase.sql.
      # Use compose interpolation (not a literal PGPASSWORD=...) to avoid CKV_SECRET_6.
      test: >-
        PGPASSWORD=${POSTGRES_PASSWORD:-tagbase}
        psql -d tagbase -h localhost -U tagbase -tAc
        "SELECT to_regclass('public.submission')"
        | grep -q submission
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    hostname: postgis
    ports:
      - "5432:5432"
    volumes:
      # Tables-only SQL: kartoza already creates role/DB; full tagbase_schema.sql
      # aborts on CREATE ROLE/DATABASE and never creates submission/etc.
      - ./services/postgis/tagbase_schema_tables.sql:/docker-entrypoint-initdb.d/01-tagbase.sql:ro
      - tagbase-test-pgdata:/var/lib/postgresql
      # Ephemeral lock dir: a named volume survives `compose down` and can skip
      # init scripts after pgdata is wiped (stale .entry_point.lock).
      - type: tmpfs
        target: /opt/data
    networks:
      - test-network

  tagbase_server:
    profiles: ["stack", "observability"]
    build:
      context: ./tagbase_server
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=test@example.com
      - POSTGRES_HOST=postgis
      - POSTGRES_PASSWORD=tagbase
      - POSTGRES_PORT=5432
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=tagbase_server
    expose:
      - "5433"
    hostname: tagbase_server
    networks:
      - test-network

  nginx:
    profiles: ["stack", "observability"]
    build:
      context: ./services/nginx
    environment:
      - NGINX_USER=testuser
      - NGINX_PASS=testpass
    depends_on:
      - tagbase_server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ | grep -q 301",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/config/nginx.test.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/proxy/:/usr/share/nginx/html/:ro
      - tagbase-test-nginx-certs:/etc/nginx/certs
      - tagbase-test-acme-www:/var/www/acme
    networks:
      - test-network

  fswatch:
    profiles: ["stack"]
    build:
      context: ./services/fswatch
    depends_on:
      - tagbase_server
    environment:
      - TAGBASE_INGEST_BASE=tagbase_server:5433/tagbase/api/v0
    volumes:
      - ./staging_data:/usr/src/app/staging_data:ro
      - fswatch-state:/var/lib/tagbase-fswatch
    networks:
      - test-network

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.21.1@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./services/observability/config.local.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - tagbase-test-alloy:/var/lib/alloy/data
    expose:
      - "12345"
      - "4317"
      - "4318"
    networks:
      - test-network
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./services/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tagbase-test-prometheus:/prometheus
    expose:
      - "9090"
    networks:
      - test-network

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./services/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - tagbase-test-loki:/loki
    expose:
      - "3100"
    networks:
      - test-network

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./services/observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tagbase-test-tempo:/var/tempo
    expose:
      - "3200"
    networks:
      - test-network

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/tagbase-ingest.json
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - tagbase-test-grafana:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - test-network
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  test-network:

volumes:
  fswatch-state:
  tagbase-test-pgdata:
  tagbase-test-alloy:
  tagbase-test-prometheus:
  tagbase-test-loki:
  tagbase-test-tempo:
  tagbase-test-grafana:
  tagbase-test-nginx-certs:
  tagbase-test-acme-www:
