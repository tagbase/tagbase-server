default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        args: ["--config", ".hadolint.yaml"]
  # Super Linter (same image/env as CI) on staged files only. Requires Docker.
  - repo: local
    hooks:
      - id: super-linter
        name: Super-Linter
        language: system
        entry: scripts/run-super-linter-pre-commit.sh
        pass_filenames: true
      - id: commitlint
        name: commitlint
        language: system
        entry: env npm_config_ignore_scripts=true npx --yes --package @commitlint/cli@21.2.2 --package @commitlint/config-conventional@21.2.2 commitlint --edit
        stages: [commit-msg]
