repos:
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        args: ["--config", ".hadolint.yaml"]
  # Super Linter (same image/env as CI) on staged files only. Requires Docker.
  - repo: local
    hooks:
      - id: super-linter
        name: Super-Linter
        language: system
        entry: scripts/run-super-linter-pre-commit.sh
        pass_filenames: true
